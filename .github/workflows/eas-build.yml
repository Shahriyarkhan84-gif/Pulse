name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      platform:
        description: "Target platform"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      view_build_id:
        description: "If set, skip building and just print details for this existing EAS build ID"
        required: false
        default: ""

jobs:
  view:
    if: github.event.inputs.view_build_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm install -g eas-cli
      - name: View build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:view ${{ inputs.view_build_id }}

  build:
    if: github.event.inputs.view_build_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Whoami (diagnostic)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Resolved identity for this EXPO_TOKEN:"
          eas whoami || true
          echo "---"
          echo "app.json expects owner/projectId:"
          node -e "console.log(require('./app.json').expo.owner, require('./app.json').expo.extra.eas.projectId)"

      - name: Link/create EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --non-interactive --force

      - name: Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait \
            --json > build-result.json || true
          echo "----- build-result.json -----"
          cat build-result.json

      - name: Summarize build
        if: always()
        run: |
          if [ -f build-result.json ]; then
            echo "## EAS Build result" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const runs = JSON.parse(require('fs').readFileSync('build-result.json', 'utf8'));
              const list = Array.isArray(runs) ? runs : [runs];
              for (const run of list) {
                console.log(\`- **\${run.platform}** (\${run.status}): \${run.artifacts?.buildUrl ?? run.error?.message ?? 'no artifact URL'}\`);
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if the EAS build itself failed
        if: always()
        run: |
          node -e "
            const runs = JSON.parse(require('fs').readFileSync('build-result.json', 'utf8'));
            const list = Array.isArray(runs) ? runs : [runs];
            const failed = list.some((r) => r.status && r.status !== 'finished');
            process.exit(failed ? 1 : 0);
          "
